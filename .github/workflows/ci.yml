name: ALBUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Secret Scan & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Rule 4 Check (MockLLM Never Imported in src/)
        run: |
          echo "Scanning src/ for illegal MockLLM imports..."
          if grep -rn "import.*MockLLM\|from.*import.*MockLLM" src/; then
            echo "AGENTS.md Rule 4 VIOLATION: MockLLM must never be imported in src/!"
            exit 1
          fi
          echo "OK: No MockLLM imports detected in src/."

      - name: Rule 7 Check (Secret Scanner)
        run: |
          python scripts/check_secrets.py

      - name: Run Pytest Test Suite
        run: |
          pytest -v --durations=10
